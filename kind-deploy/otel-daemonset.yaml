# OTel DaemonSet — in-cluster agent for kubeletstats, container logs, and k8s events
#
# Deploy into the kind cluster (start-kind.sh / setup-kind-cluster.sh do both steps):
#   1. the `aegis-credentials` Secret in otel-system, holding an AEGIS API key with
#      scope `agent` (telemetry push only) — never committed here:
#        source kind-deploy/aegis-telemetry-key.sh   # mints or reuses the key
#      or by hand:
#        kubectl -n otel-system create secret generic aegis-credentials \
#          --from-literal=api-key=<agent key from POST /v1/tenants/api-keys {"scope":"agent"}>
#   2. kubectl apply -f kind-deploy/otel-daemonset.yaml
#
# One agent pod runs per node (kubeletstats + filelog).
# Both agents observe k8s Events, but a filter exports them only from the
# control-plane agent to avoid duplicate event streams.
# Telemetry is sent through the AEGIS API Gateway on host port 8000 — the only way
# in to AEGIS's collector, which is not published to the host. The gateway sets
# the tenant from the API key; AEGIS's collector deletes any tenant_id in the
# payload, so this agent does not set one.

---
apiVersion: v1
kind: Namespace
metadata:
  name: otel-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  namespace: otel-system
data:
  config.yaml: |
    receivers:
      kubeletstats:
        collection_interval: 20s
        auth_type: serviceAccount
        endpoint: "${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container

      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
        include_file_path: true
        include_file_name: false

      # k8s Events (CrashLoopBackOff, OOMKilled, image pull errors, etc.).
      # Each agent observes them; filter/k8s_events_control_plane below drops
      # the worker copy so only one event stream is exported.
      k8sobjects:
        auth_type: serviceAccount
        objects:
          - name: events
            mode: watch
            namespaces: [default, kube-system, otel-demo, otel-system]
            group: ""

    processors:
      batch:
        timeout: 5s
      resource/node:
        attributes:
          - key: k8s.node.name
            value: "${env:K8S_NODE_NAME}"
            action: insert
          - key: k8s.cluster.name
            value: "kind-aegis"
            action: insert
      filter/k8s_events_control_plane:
        error_mode: ignore
        logs:
          log_record:
            - 'resource.attributes["k8s.node.name"] != "kind-aegis-control-plane"'

    exporters:
      # Send through the API Gateway so the API key (scope `agent`) is
      # authenticated and the authoritative X-Tenant-ID header is injected
      # before collector ingest.
      otlphttp/aegis:
        metrics_endpoint: http://host.docker.internal:8000/v1/telemetry/metrics
        logs_endpoint: http://host.docker.internal:8000/v1/telemetry/logs
        headers:
          X-AEGIS-API-KEY: "${env:AEGIS_API_KEY}"
        compression: none
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 500

    service:
      pipelines:
        metrics:
          receivers: [kubeletstats]
          processors: [resource/node, batch]
          exporters: [otlphttp/aegis]
        logs:
          receivers: [filelog]
          processors: [resource/node, batch]
          exporters: [otlphttp/aegis]
        logs/k8s_events:
          receivers: [k8sobjects]
          processors: [resource/node, filter/k8s_events_control_plane, batch]
          exporters: [otlphttp/aegis]

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: otel-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/stats, nodes/proxy, pods, namespaces, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: otel-system

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: otel-system
spec:
  selector:
    matchLabels:
      app: otel-agent
  template:
    metadata:
      labels:
        app: otel-agent
    spec:
      serviceAccountName: otel-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.100.0
          args: ["--config=/conf/config.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AEGIS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aegis-credentials
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 300Mi
      volumes:
        - name: config
          configMap:
            name: otel-agent-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
